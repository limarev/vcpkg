name: Test

on:
  pull_request:
  push:
    branches: [main, codex/standalone-repo]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          jq -e '.tag | type == "string" and length > 0' vcpkg-upstream.json
          jq -e '.commit | test("^[0-9a-f]{40}$")' vcpkg-upstream.json
          jq -e 'type == "array" and length > 0 and all(.[]; (.origin | test("^https://")) and (.path | test("^[^/].*/$")))' routes.json

      - name: Check overlay identities
        run: |
          for manifest in ports/*/vcpkg.json; do
            directory="$(basename "$(dirname "$manifest")")"
            declared="$(jq -r .name "$manifest")"
            test "$directory" = "$declared"
            test -f "ports/$directory/portfile.cmake"
          done

      - name: Fetch pinned upstream
        run: |
          tag="$(jq -r .tag vcpkg-upstream.json)"
          expected="$(jq -r .commit vcpkg-upstream.json)"
          git init upstream
          git -C upstream remote add origin https://github.com/microsoft/vcpkg.git
          git -C upstream fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          actual="$(git -C upstream rev-parse "$tag^{}")"
          test "$actual" = "$expected"
          git -C upstream checkout --detach "$actual"

      - name: Bootstrap vcpkg
        run: ./upstream/bootstrap-vcpkg.sh -disableMetrics

      - name: Validate port manifests
        run: |
          ./upstream/vcpkg format-manifest ports/*/vcpkg.json
          git diff --exit-code -- ports

      - name: Generate filesystem registry
        run: |
          cmake \
            -DUPSTREAM_DIR="$PWD/upstream" \
            -DOVERLAY_PORTS_DIR="$PWD/ports" \
            -DDST_DIR="$PWD/build/registry" \
            -DBASELINE="$(jq -r .tag vcpkg-upstream.json)" \
            -DVCPKG_EXECUTABLE="$PWD/upstream/vcpkg" \
            -P filesystem_registry.cmake
          test -x build/registry/vcpkg
          jq -e --arg baseline "$(jq -r .tag vcpkg-upstream.json)" 'has($baseline)' build/registry/versions/baseline.json

      - name: Build argparse consumer test
        env:
          VCPKG_ROOT: ${{ github.workspace }}/upstream
        run: |
          cmake \
            -S tests/argparse \
            -B build/argparse \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/argparse
          ./build/argparse/argparse-test

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Nginx configuration from routes
        run: |
          {
            echo 'server {'
            echo '  listen 8443 ssl;'
            echo '  ssl_certificate /etc/nginx/tls/nginx.crt;'
            echo '  ssl_certificate_key /etc/nginx/tls/nginx.key;'
            echo '  auth_basic "vcpkg proxy";'
            echo '  auth_basic_user_file /etc/nginx/.htpasswd;'
            echo '  proxy_pass_request_headers off;'
            jq -r '.[] | (.origin | capture("^https://(?<host>[^/]+)(?<base>/.*)$")) as $u | "  location ^~ /\(.path) { proxy_pass \(.origin); proxy_set_header Host \($u.host); proxy_ssl_name \($u.host); proxy_ssl_server_name on; }"' routes.json
            echo '}'
          } > proxy.conf

      - name: Start test proxy
        run: |
          mkdir tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout tls/nginx.key -out tls/nginx.crt -subj '/CN=127.0.0.1'
          openssl passwd -apr1 -salt test 'secret' | sed 's/^/user:/' > .htpasswd
          docker run -d --name proxy \
            -p 127.0.0.1:8443:8443 \
            -v "$PWD/proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/.htpasswd:/etc/nginx/.htpasswd:ro" \
            -v "$PWD/tls:/etc/nginx/tls:ro" \
            nginx:alpine

      - name: Test routed download
        env:
          VCPKG_PROXY_URL: https://127.0.0.1:8443
          VCPKG_PROXY_USERNAME: user
          VCPKG_PROXY_PASSWORD: secret
          VCPKG_PROXY_TLS_VERIFY: OFF
        run: |
          cmake \
            -DURL=https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz \
            -DSHA512=083f5e675d73f3233c7930ebe20425a533feedeaaa9d8cc86831312a6581cefbe6ed0d08d2fa89be81082f2a5abdabca8b3c080bf97218a1bd59dc118a30b9f3 \
            -DDST_FILE="$RUNNER_TEMP/bzip2.tar.gz" \
            -P download.cmake

      - name: Reject unsupported origin
        env:
          VCPKG_PROXY_URL: https://127.0.0.1:8443
        run: |
          if cmake -DURL=https://example.invalid/archive.tar.gz -DSHA512=00 -DDST_FILE="$RUNNER_TEMP/unexpected" -P download.cmake; then
            echo 'unsupported origin unexpectedly succeeded'
            exit 1
          fi
