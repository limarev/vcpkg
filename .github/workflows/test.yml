name: Test

on:
  workflow_call:
    outputs:
      upstream_tag:
        value: ${{ jobs.configuration.outputs.upstream_tag }}
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate repository configuration
        run: tests/validate-config.sh

      - name: Read pinned vcpkg reference
        id: upstream
        run: echo "tag=$(<vcpkg-upstream-tag.txt)" >> "$GITHUB_OUTPUT"

  repository-and-ports:
    needs: configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v6

      - name: Check out pinned upstream vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ needs.configuration.outputs.upstream_tag }}
          path: upstream

      - name: Bootstrap vcpkg
        run: ./upstream/bootstrap-vcpkg.sh -disableMetrics

      - name: Generate and validate bundle
        run: tests/test-bundle.sh upstream

      - name: Build all overlay ports
        run: tests/test-ports-linux.sh upstream

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test proxy routes and downloader
        run: tests/test-proxy.sh
