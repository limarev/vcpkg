name: Monitor upstream vcpkg

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: monitor-upstream-vcpkg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find the latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(<vcpkg-upstream-tag.txt)"
          latest="$(gh api repos/microsoft/vcpkg/releases/latest --jq .tag_name)"

          echo "Pinned upstream release: $pinned"
          echo "Latest upstream release: $latest"

          if [[ "$latest" == "$pinned" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$pinned" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ \
             && "$latest" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ \
             && "$latest" < "$pinned" ]]; then
            echo "The latest stable GitHub release is older than the pinned release; refusing to downgrade."
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "update=true" >> "$GITHUB_OUTPUT"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"

      - name: Open or update the upstream release pull request
        if: steps.upstream.outputs.update == 'true'
        id: pull-request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          branch="automation/update-vcpkg"
          title="Update upstream vcpkg to $UPSTREAM_TAG"
          body="Updates the pinned microsoft/vcpkg release to \`$UPSTREAM_TAG\`.

          The bot has dispatched the repository test workflow for this commit. Review any replacement-port differences or patch conflicts before merging. Merging this pull request publishes the corresponding custom release after the release workflow passes."
          open_pr="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"

          if git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null; then
            remote_tag="$(git show "origin/$branch:vcpkg-upstream-tag.txt" 2>/dev/null || true)"
            if [[ "$remote_tag" == "$UPSTREAM_TAG" && -n "$open_pr" ]]; then
              echo "Pull request #$open_pr already proposes $UPSTREAM_TAG."
              echo "dispatch_tests=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --force-create "$branch" "origin/$DEFAULT_BRANCH"
          printf '%s\n' "$UPSTREAM_TAG" > vcpkg-upstream-tag.txt
          git add vcpkg-upstream-tag.txt
          git commit -m "$title"
          git push --force origin "HEAD:refs/heads/$branch"

          if [[ -n "$open_pr" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$open_pr" \
              -f title="$title" \
              -f body="$body" >/dev/null
            echo "Updated pull request #$open_pr."
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "$title" --body "$body"
          fi

          echo "dispatch_tests=true" >> "$GITHUB_OUTPUT"

      - name: Validate the bot branch
        if: steps.pull-request.outputs.dispatch_tests == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref automation/update-vcpkg
