name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream vcpkg tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux
            executable: vcpkg
          - os: macos-latest
            asset: macos
            executable: vcpkg
          - os: windows-latest
            asset: windows
            executable: vcpkg.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Verify requested upstream
        run: |
          test '${{ inputs.tag }}' = "$(jq -r .tag vcpkg-upstream.json)"
          expected="$(jq -r .commit vcpkg-upstream.json)"
          git init upstream
          git -C upstream remote add origin https://github.com/microsoft/vcpkg.git
          git -C upstream fetch --depth=1 origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"
          actual="$(git -C upstream rev-parse '${{ inputs.tag }}^{}')"
          test "$actual" = "$expected"
          git -C upstream checkout --detach "$actual"

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        run: ./upstream/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        run: cmd.exe //c upstream\\bootstrap-vcpkg.bat -disableMetrics

      - name: Generate bundle
        run: |
          cmake \
            -DUPSTREAM_DIR="$PWD/upstream" \
            -DOVERLAY_PORTS_DIR="$PWD/ports" \
            -DDST_DIR="$PWD/build/vcpkg-${{ inputs.tag }}-${{ matrix.asset }}" \
            -DBASELINE='${{ inputs.tag }}' \
            -DVCPKG_EXECUTABLE="$PWD/upstream/${{ matrix.executable }}" \
            -P filesystem_registry.cmake

      - name: Create archive and checksum
        run: |
          archive="vcpkg-${{ inputs.tag }}-${{ matrix.asset }}.zip"
          cmake -E chdir build cmake -E tar cf "../$archive" --format=zip "vcpkg-${{ inputs.tag }}-${{ matrix.asset }}"
          cmake -E sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: vcpkg-${{ matrix.asset }}
          path: |
            vcpkg-${{ inputs.tag }}-${{ matrix.asset }}.zip
            vcpkg-${{ inputs.tag }}-${{ matrix.asset }}.zip.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.tag }}'
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "Customized distribution built from microsoft/vcpkg $tag. Customization commit: $GITHUB_SHA"
          else
            gh release create "$tag" --title "$tag" --notes "Customized distribution built from microsoft/vcpkg $tag. Customization commit: $GITHUB_SHA"
          fi
          gh release upload "$tag" artifacts/* --clobber
