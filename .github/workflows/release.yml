name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream vcpkg tag
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux
            executable: vcpkg
          - os: macos-latest
            asset: macos
            executable: vcpkg
          - os: windows-latest
            asset: windows
            executable: vcpkg.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Check out pinned upstream vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ inputs.tag || needs.test.outputs.upstream_tag }}
          path: upstream

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        run: ./upstream/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        run: cmd.exe //c upstream\\bootstrap-vcpkg.bat -disableMetrics

      - name: Generate bundle
        run: |
          cmake \
            -DUPSTREAM_DIR="$PWD/upstream" \
            -DOVERLAY_PORTS_DIR="$PWD/ports" \
            -DDST_DIR="$PWD/build/vcpkg-${{ inputs.tag || needs.test.outputs.upstream_tag }}-${{ matrix.asset }}" \
            -DBASELINE='${{ inputs.tag || needs.test.outputs.upstream_tag }}' \
            -DVCPKG_EXECUTABLE="$PWD/upstream/${{ matrix.executable }}" \
            -P filesystem_registry.cmake

      - name: Create archive
        run: |
          archive="vcpkg-${{ inputs.tag || needs.test.outputs.upstream_tag }}-${{ matrix.asset }}.zip"
          cmake -E chdir build cmake -E tar cf "../$archive" --format=zip "vcpkg-${{ inputs.tag || needs.test.outputs.upstream_tag }}-${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: vcpkg-${{ matrix.asset }}
          path: vcpkg-${{ inputs.tag || needs.test.outputs.upstream_tag }}-${{ matrix.asset }}.zip

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.tag || needs.test.outputs.upstream_tag }}'
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "Customized distribution built from microsoft/vcpkg $tag. Customization commit: $GITHUB_SHA"
          else
            gh release create "$tag" --title "$tag" --notes "Customized distribution built from microsoft/vcpkg $tag. Customization commit: $GITHUB_SHA"
          fi
          gh release upload "$tag" artifacts/* --clobber
